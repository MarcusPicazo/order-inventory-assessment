version: "3.8"

services:
  webhooks:
    build: .
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/orderdb?schema=public
      REDIS_URL: redis://redis:6379
      PORT: "3002"
    ports:
      - "3002:3002"
    networks:
      - phase1-network

networks:
  phase1-network:
    external: true
    name: phase-1-debugging_default
